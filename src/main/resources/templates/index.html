<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments :: head('Guide touristique du Maroc')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
  <h1 class="mb-2">Découvre le Maroc</h1>
  <p class="muted">Choisis une ville ou laisse l'application composer ton itinéraire.</p>
  <div class="row g-3">
    <div class="col-md-4" th:each="c : ${cities}">
      <div class="card h-100"><div class="card-body">
        <h2 class="h4" th:text="${c.name}">Ville</h2>
        <p th:text="${c.description}"></p>
        <p class="muted small" th:if="${c.bestSeason != null}" th:text="'Meilleure saison : ' + ${c.bestSeason}"></p>
        <a class="btn btn-dark" th:href="@{/cities/{n}(n=${c.name})}">Voir la ville</a>
      </div></div>
    </div>
  </div>
  <a class="btn btn-outline-dark mt-4" th:href="@{/recommend}">Créer mon itinéraire</a>
</main>
</body>
</html>
